<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TreasureHunt - View Items</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .main-content {
            padding: 20px;
        }
        #live-auction-items {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .item-card {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
            width: 250px;
            display: inline-block;
            vertical-align: top;
            text-align: center;
            background-color: #f9f9f9;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }
        .item-card img {
            max-width: 100%;
            height: 150px;
            object-fit: cover;
            margin-bottom: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header>
        <img src="treasure-hunter.png" alt="Treasure Hunt Banner" class="banner">
        <div class="header-content">
            <div class="header-left">
                <img src="Logo.png" alt="Treasure Hunt Logo" class="logo">
                <h1>TreasureHunt Auction System</h1>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="TresureHunt.html" class="nav-button">Home</a></li>
                <li><a href="Register.html" class="nav-button">Register</a></li>
                <li><a href="login.html" class="nav-button">Login</a></li>
                <li><a href="ViewItem.html" class="nav-button active">View Items</a></li>
                <li><a href="Sell.html" class="nav-button">Sell Item</a></li>
                <li><a href="Admin.html" class="nav-button">Admin Login</a></li>
                <li><a href="Help.html" class="nav-button">Help</a></li>
                <li><a href="Contact.html" class="nav-button">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="main-content">
        <h2>Live Auction Items</h2>
        <div id="live-auction-items">
            <p>Loading...</p>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 TreasureHunt Auction System | <a href="Contact.html">Contact</a> | <a href="Help.html">Help</a></p>
    </footer>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        fetch("php/fetch_items.php")
            .then((response) => response.json())
            .then((items) => {
                const container = document.getElementById("live-auction-items");
                container.innerHTML = "";

                if (items.length === 0) {
                    container.innerHTML = "<p>No items found.</p>";
                    return;
                }

                items.forEach((item) => {
                    const card = document.createElement("div");
                    card.className = "item-card";

                    const imgSrc = item.image_path && item.image_path !== "" ? item.image_path : "placeholder.jpg";
                    card.innerHTML = `
                        <img src="${imgSrc}" alt="${item.name}" class="item-image">
                        <h3>${item.name}</h3>
                        <p>${item.description}</p>
                        <p><strong>Category:</strong> ${item.CategoryName}</p>
                        <p><strong>Starting at:</strong> $${item.startingprice}</p>

                        <form action="php/place_bid.php" method="POST">
                            <input type="hidden" name="item_id" value="${item.item_id}">
                            
                            <label for="bidder_id_${item.item_id}">Your User ID:</label>
                            <input type="number" name="bidder_id" id="bidder_id_${item.item_id}" required>

                            <label for="bid_amount_${item.item_id}">Your Bid ($):</label>
                            <input type="number" step="0.01" name="bid_amount" id="bid_amount_${item.item_id}" required>

                            <button type="submit">Place Bid</button>
                        </form>
                    `;

                    container.appendChild(card);
                });
            })
            .catch((error) => {
                console.error("Error loading items:", error);
                document.getElementById("live-auction-items").innerHTML =
                    "<p>Failed to load items.</p>";
            });
    });
    </script>

    <!-- ✅ New external JavaScript file reference -->
    <script src="view_items.js"></script>
</body>
</html>
